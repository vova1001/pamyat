# Бесплатный Render засыпает через 15 минут без посетителей. Раз в 10 минут заходим на /ping —
# отвечает nginx, база (Neon) не просыпается. Одного сервиса 24/7 (~744 ч) хватает в 750 бесплатных часов Render.
name: keepalive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 90 https://kofesobaken.onrender.com/ping || true
