# Единый вход: сайт и кабинет — Astro, /api и /uploads — Go. Один адрес → cookie кабинета без CORS.
server {
    listen 80;
    server_name _;
    client_max_body_size 10m;
    server_tokens off;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/      { proxy_pass http://backend:8080; }
    location /uploads/  { proxy_pass http://backend:8080; }
    location = /healthz { proxy_pass http://backend:8080; }

    location /img/ {
        proxy_pass http://frontend:4321;
        expires 7d;
    }
    location /_astro/ {
        proxy_pass http://frontend:4321;
        expires 1y;
    }
    location / { proxy_pass http://frontend:4321; }
}
